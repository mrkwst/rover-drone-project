# Wokwi Configuration for Rover-Drone Project
# See: https://docs.wokwi.com/wokwi.toml

[wokwi]
version = 1

# Firmware binary to load (built by PlatformIO)
# Run `cd ../../firmware && pio run` to generate this file
firmware = "../../firmware/.pio/build/esp32dev/firmware.bin"

# Serial monitor settings
[serial]
baudrate = 115200

# Network settings for WebSocket testing
# Wokwi creates a virtual network - ESP32 AP will be accessible
[network]
mode = "wifi"
ssid = "Rover_AP"
password = "rover123"

# Custom parts (if any)
[[parts]]
# TB6612FNG motor driver is built-in
type = "tb6612fng"

[[parts]]
# HC-SR04 ultrasonic is built-in
type = "hc-sr04"

[[parts]]
# MPU6050 IMU is built-in
type = "mpu6050"

[[parts]]
# IR Reflectance sensor (TCRT5000) is built-in
type = "ir-reflectance-sensor"

[[parts]]
# DC Motor is built-in
type = "dc-motor"

[[parts]]
# Encoder is built-in
type = "encoder"

# Simulation options
[simulation]
# Speed multiplier (1 = real-time, >1 = faster)
speed = 1

# Enable logic analyzer on specific pins
logic_analyzer = [
  "D4",   # STBY
  "D5",   # AIN1
  "D18",  # AIN2
  "D19",  # PWMA
  "D21",  # BIN1
  "D22",  # BIN2
  "D23",  # PWMB
  "D14",  # Enc LA
  "D26",  # Enc RA
  "D13",  # US Front Trig
  "D12",  # US Front Echo
  "D2",   # US Rear Trig
  "D15",  # US Rear Echo
  "D16",  # I2C SDA
  "D17",  # I2C SCL
]

# Plotting configuration for serial plotter
[[plots]]
name = "Motor PWM"
pins = ["D19", "D23"]  # PWMA, PWMB
colors = ["red", "blue"]

[[plots]]
name = "Encoder Counts"
# Virtual pins - use serial output parsing instead
pins = []

[[plots]]
name = "Sensors"
pins = ["D36", "VN", "D34", "D35"]  # Line sensors L2, L1, R1, R2

