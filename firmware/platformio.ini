; PlatformIO Project Configuration for ESP32 Rover
; Based on: ESP32 DevKitC V1 (USB-C, WROOM-32)
; Hardware: TB6612FNG, HC-SR04(x2), MPU6050, TCRT5000(x4), 2S 18650 + XH957 buck

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags
build_flags = 
  -DCORE_DEBUG_LEVEL=3
  
  -Wall
  -Wextra

; Libraries (auto-installed via lib_deps)
lib_deps = 
  ; AsyncWebServer for WebSocket + HTTP
  https://github.com/me-no-dev/ESPAsyncWebServer#master
  https://github.com/me-no-dev/AsyncTCP#master
  
  ; ArduinoJson for JSON serialization
  bblanchon/ArduinoJson@^7.0.4
  
  ; MPU6050 library (I2C)
  electroniccats/MPU6050@^1.0.3
  
  ; PID control
  br3ttb/PID@^1.2.0

; Custom partitions (optional, for OTA)
; board_build.partitions = default_ota.csv

; Flash frequency
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

; Upload settings
upload_speed = 921600